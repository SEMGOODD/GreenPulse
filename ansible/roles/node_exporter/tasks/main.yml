---
# node_exporter: system metrics (CPU, RAM, disk, network) on every VM.

- name: Install node_exporter (Ubuntu package)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the listen address
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Ensure node_exporter is started and enabled at boot
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: started
    enabled: true
