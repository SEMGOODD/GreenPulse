---
# App role: deploys the GreenPulse microservices with Docker Compose,
# then tests the API from the controller.

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_compose_dir }}"

- name: Copy the services and the Compose file
  ansible.builtin.copy:
    src: "{{ app_services_src }}/{{ item }}"
    dest: "{{ app_compose_dir }}/{{ item }}"
    owner: root
    group: root
    mode: preserve
  loop: "{{ app_services_files }}"

# Compose reads this .env automatically. It holds the DB password:
# readable by root only, never printed by Ansible.
- name: Write the Compose environment file
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ app_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

# Equivalent of `docker compose up --build --wait --remove-orphans`.
# Docker's layer cache makes the rebuild fast when the code did not change.
- name: Build and start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_compose_dir }}"
    build: "{{ 'always' if app_build_images else 'never' }}"
    pull: "{{ 'never' if app_build_images else 'always' }}"
    state: present
    remove_orphans: true
    # Wait until every service with a healthcheck reports "healthy".
    wait: true
    wait_timeout: "{{ app_compose_wait_timeout }}"
  register: app_compose

- name: Show the state of the containers
  ansible.builtin.debug:
    msg: "{{ item.Service }}: {{ item.Status }}"
  loop: "{{ app_compose.containers }}"
  loop_control:
    label: "{{ item.Service }}"

# --- API test ---
# Sent from the controller to the PUBLIC IP, like a browser: it also proves
# that the security group lets port 8080 in.
- name: Request the API from the controller
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ app_port }}/api/hello"
    return_content: true
  register: app_api_response
  delegate_to: localhost
  become: false
  until: app_api_response.status == 200
  retries: "{{ app_healthcheck_retries }}"
  delay: "{{ app_healthcheck_delay }}"

- name: Show the API response
  ansible.builtin.debug:
    msg: "GET http://{{ ansible_host }}:{{ app_port }}/api/hello -> {{ app_api_response.status }} '{{ app_api_response.json.message }}'"
