# Ansible configuration for GreenPulse.
# Ansible reads this file automatically when commands are run from this folder.

[defaults]
# Generated by Terraform (step 4); see inventory.ini.example for its format.
inventory = inventory.ini
roles_path = roles
# Default SSH user of the Ubuntu AWS images (passwordless sudo).
remote_user = ubuntu
# Lets Terraform run the playbook without prompting for the vault password.
# The file lives OUTSIDE the repository and must never be committed.
vault_password_file = ~/.greenpulse_vault_pass
interpreter_python = auto_silent
# More readable task output.
callback_result_format = yaml

[ssh_connection]
# The VMs are recreated on every `terraform apply`, so their host keys are new:
# accept unknown keys automatically, but still refuse a key that CHANGED.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
# Fewer SSH round-trips per task, and lets `become_user: postgres` work cleanly.
pipelining = True
