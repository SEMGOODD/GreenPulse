---

- name: Wait until the new VMs are reachable and fully booted
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # cloud-init configures the VM at first boot and holds the apt lock meanwhile.
    - name: Wait for cloud-init to finish
      community.general.cloud_init_data_facts:
        filter: status
      register: cloud_init_result
      until: >-
        cloud_init_result.cloud_init_data_facts.status.v1.stage is defined
        and not cloud_init_result.cloud_init_data_facts.status.v1.stage
      retries: 60
      delay: 5

- name: Prepare every VM (updates, base packages, SSH hardening)
  hosts: all
  become: true
  roles:
    - common
    - node_exporter

- name: Deploy PostgreSQL on the BDD VM
  hosts: bdd
  become: true
  roles:
    - postgres
    - postgres_exporter

- name: Deploy the GreenPulse microservices on the APP VM
  hosts: app
  become: true
  roles:
    - docker
    - app

# Only runs when Terraform created the monitoring VM (enable_monitoring = true):
# otherwise the "monitoring" group is empty and the play is skipped.
- name: Deploy Prometheus, Alertmanager and Grafana on the MONITORING VM
  hosts: monitoring
  become: true
  roles:
    - docker
    - monitoring
