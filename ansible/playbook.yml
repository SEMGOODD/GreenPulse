---

- name: Prepare every VM (updates, base packages, SSH hardening)
  hosts: all
  become: true
  roles:
    - common

- name: Deploy PostgreSQL on the BDD VM
  hosts: bdd
  become: true
  roles:
    - postgres

- name: Deploy the FastAPI application on the APP VM
  hosts: app
  become: true
  roles:
    - app
