name: CI

on:
  push: 
    branches:
      - main
  pull_request:
    branches:
      - main
 
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
      
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
        working-directory: terraform
      
      - name: Validate the main configuration
        run: | 
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform
      
      - name: Validate the bootstrap configuration
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform/bootstrap

  ansible:
    name: ansible checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Install Python 
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible lint
        run: pip install ansible-lint
      
      - name: Install collections from requirement file
        run: |
          ansible-galaxy collection install -r requirements.yml
      
      - name: Create a dummy vault password file
        run: echo "dummy-password-for-lint" > ~/.greenpulse_vault_pass
      
      - name: Run ansible-lint
        run: |
          ansible-lint

  services:
    name: build the 4 Docker images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Build the 4 docker images
        run: docker compose --env-file .env.example build
